<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>FleetPro - AI-Powered Fleet Management Platform</title>
    <meta
      name="description"
      content="FleetPro is an AI-powered fleet management, vehicle tracking, and load matching platform for African logistics operations. Real-time tracking, WhatsApp integration, and intelligent dispatch."
    />
    <meta name="author" content="FleetPro" />
    <meta property="og:title" content="FleetPro - Fleet Management Platform" />
    <meta
      property="og:description"
      content="AI-Powered Fleet Management, Vehicle Tracking & Load Matching Platform for Africa"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (!stored || stored === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
