name: Admin CI/CD

on:
  pull_request:
    paths:
      - apps/admin/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/scripts/**
  push:
    branches:
      - main
    paths:
      - apps/admin/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/scripts/**
  workflow_dispatch:

# A run on main may be the only one that deploys this app, so a newer push must
# not cancel it. Each main run gets its own group; only pull requests cancel.
concurrency:
  group: truckmoov-admin-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_NAME: truckmoov-admin
  RELEASE_ARCHIVE: truckmoov-admin-release.tar.gz

jobs:
  affected:
    name: Affected
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this app can change
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: .github/scripts/affected.sh admin admin-cicd.yml

  validate:
    name: Validate
    needs: affected
    if: needs.affected.outputs.affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build environment file
        run: |
          if [ -n "${ADMIN_ENV}" ]; then
            printf '%s' "${ADMIN_ENV}" | base64 -d > apps/admin/.env.production
          elif [ -f apps/admin/.env.example ]; then
            cp apps/admin/.env.example apps/admin/.env.production
          fi
        env:
          ADMIN_ENV: ${{ github.event_name != 'pull_request' && secrets.ADMIN_ENV || '' }}

      - name: Lint
        run: pnpm turbo lint --filter admin

      - name: Typecheck
        run: pnpm turbo typecheck --filter admin

      - name: Build admin
        run: pnpm turbo build --filter admin

      - name: Package release
        if: github.event_name != 'pull_request'
        run: |
          tar --owner=0 --group=0 --mode='go-w' -czf "${RELEASE_ARCHIVE}" -C apps/admin/dist .
          ls -lh "${RELEASE_ARCHIVE}"
          test -f "${RELEASE_ARCHIVE}"

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: truckmoov-admin-release
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error

  test:
    name: Test
    needs: affected
    if: needs.affected.outputs.affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # admin... also runs the suites of the workspace packages it depends on (app-core).
      - name: Test
        run: pnpm turbo test --filter 'admin...'

  # Out-of-order finishes: if a newer commit on main also changes this app, its
  # run deploys a build that already contains this one, so this one stands down.
  latest:
    name: Newest for this app
    needs: [affected, validate, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.affected.outputs.affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      superseded: ${{ steps.newer.outputs.affected }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Does a newer commit change this app
        id: newer
        env:
          EVENT: push
          BASE: ${{ github.sha }}
          HEAD: HEAD
        run: .github/scripts/affected.sh admin admin-cicd.yml

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.affected.outputs.affected == 'true' && needs.latest.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    needs: [affected, validate, test, latest]
    concurrency:
      group: deploy-truckmoov-admin
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: truckmoov-admin-release

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT_RAW: ${{ secrets.DEV_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT_RAW:-22}"
          echo "SSH_PORT=$PORT" >> $GITHUB_ENV
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          ssh-keyscan -t ed25519 -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write .env to shared
        env:
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          ENV_B64: ${{ secrets.ADMIN_ENV }}
        run: |
          printf '%s' "$ENV_B64" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "write-env $APP_NAME"

      - name: Deploy via wrapper
        env:
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          RELEASE="release-$(date +%s)-${RUN_NUMBER}-${COMMIT_SHA}"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "deploy $APP_NAME $RELEASE" < "${RELEASE_ARCHIVE}"

      - name: Tear down SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
