name: Admin CI/CD

on:
  pull_request:
    paths:
      - apps/admin/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
  push:
    branches:
      - main
    paths:
      - apps/admin/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: truckmoov-admin-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: truckmoov-admin
  RELEASE_ARCHIVE: truckmoov-admin-release.tar.gz

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build environment file
        run: |
          if [ -n "${ADMIN_ENV}" ]; then
            printf '%s' "${ADMIN_ENV}" | base64 -d > apps/admin/.env.production
          elif [ -f apps/admin/.env.example ]; then
            cp apps/admin/.env.example apps/admin/.env.production
          fi
        env:
          ADMIN_ENV: ${{ secrets.ADMIN_ENV }}

      - name: Build admin
        run: pnpm turbo build --filter admin

      - name: Package release
        if: github.event_name != 'pull_request'
        run: |
          tar --owner=0 --group=0 --mode='go-w' -czf "${RELEASE_ARCHIVE}" -C apps/admin/dist .
          ls -lh "${RELEASE_ARCHIVE}"
          test -f "${RELEASE_ARCHIVE}"

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: truckmoov-admin-release
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: truckmoov-admin-release

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT_RAW: ${{ secrets.DEV_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT_RAW:-22}"
          echo "SSH_PORT=$PORT" >> $GITHUB_ENV
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          ssh-keyscan -t ed25519 -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via wrapper
        env:
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          RELEASE="release-$(date +%s)-${RUN_NUMBER}-${COMMIT_SHA}"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "deploy $APP_NAME $RELEASE" < "${RELEASE_ARCHIVE}"

      - name: Reload PM2
        env:
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "pm2 reload $APP_NAME || pm2 start /var/www/$APP_NAME/current --name $APP_NAME"

      - name: Tear down SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
